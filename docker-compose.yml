# Local development / smoke-testing stack only.
# Databricks (Feature Store, Delta Lake, Model Serving) is NOT emulated here -
# it requires a real workspace. This compose file gives you a real Kafka broker
# and a real Redis instance so streaming/producer.py, serving/scoring_api.py,
# and the tests can run end-to-end on a laptop.
services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: fraud-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Single PLAINTEXT listener advertising `localhost`, since the only clients in
      # this dev stack are host processes (streaming/producer.py, serving/, pytest) --
      # not other containers. Advertising the container's own hostname here (a common
      # copy-pasted default) breaks host clients: they'd resolve `kafka:9092` from
      # Kafka's metadata response, which doesn't exist as a DNS name outside Docker's
      # network. That was caught by actually running the producer against this file.
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: fraud-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  kafka-data:
  redis-data:
