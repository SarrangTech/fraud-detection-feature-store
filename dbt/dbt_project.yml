name: "fraud_feature_store"
version: "1.0.0"
config-version: 2

profile: "fraud_feature_store"

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # Fully-qualified Unity Catalog location of the bronze table written by
  # notebooks/00_bronze_streaming_consumer.py
  bronze_catalog: "{{ env_var('UC_CATALOG', 'fraud_detection') }}"
  bronze_schema: "{{ env_var('UC_SCHEMA', 'feature_store') }}"
  # Rolling-window lookback sizes, in seconds, shared by all velocity/spend/volatility models
  window_1h_seconds: 3600
  window_24h_seconds: 86400
  window_7d_seconds: 604800

models:
  fraud_feature_store:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    silver:
      +materialized: table
      +file_format: delta
