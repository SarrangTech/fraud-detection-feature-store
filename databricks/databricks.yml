# Databricks Asset Bundle definition. Deploy with:
#   databricks bundle deploy -t dev
#   databricks bundle run -t dev bronze_streaming_job
bundle:
  name: fraud-detection-feature-store

include:
  - resources/*.yml

variables:
  uc_catalog:
    description: Unity Catalog catalog for all bronze/silver/feature-store assets
    default: workspace
  uc_schema:
    default: fraud_feature_store
  model_full_name:
    description: >
      Fully-qualified UC model name. Registered under catalog.default (matching this
      workspace's existing workspace.default.fraud_detection_v2), not catalog.schema.
    default: workspace.default.fraud_detection_feature_store
  kafka_bootstrap_servers:
    default: localhost:9092
  kafka_topic:
    default: fraud.transactions.raw
  redis_host:
    default: localhost
  redis_port:
    default: "6379"
  notebook_path_prefix:
    default: ${workspace.file_path}/notebooks
  model_serving_endpoint_name:
    default: fraud-gbm-realtime

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: ${DATABRICKS_HOST}
  prod:
    mode: production
    workspace:
      host: ${DATABRICKS_HOST}
    run_as:
      service_principal_name: ${DATABRICKS_SERVICE_PRINCIPAL}
